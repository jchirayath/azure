<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OnDemand Portal">
  <defs>
    <linearGradient id="odG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="#0c111a"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#1e2a3c"/>

  <!-- The portal arch: solid where the lab is standing, dissolving into dots
       on the right where it is torn down again. Ephemeral by design. -->
  <path d="M22 76V44a26 26 0 0 1 26-26"
        fill="none" stroke="url(#odG)" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 18a26 26 0 0 1 15.5 5.1"
        fill="none" stroke="url(#odG)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <g fill="url(#odG)">
    <circle cx="69.4" cy="29.4" r="2.5" opacity=".68"/>
    <circle cx="72.6" cy="38.2" r="2.2" opacity=".5"/>
    <circle cx="74" cy="47.5" r="2" opacity=".36"/>
    <circle cx="74" cy="57" r="1.7" opacity=".26"/>
    <circle cx="74" cy="66" r="1.4" opacity=".18"/>
    <circle cx="74" cy="74.5" r="1.2" opacity=".12"/>
  </g>

  <!-- the gate: only the right identity walks through -->
  <g fill="none" stroke="url(#odG)" stroke-width="2.4" stroke-linejoin="round">
    <path d="M48 33.5l10.5 4v9.2c0 6.6-4.3 11.9-10.5 13.8-6.2-1.9-10.5-7.2-10.5-13.8V37.5z"/>
  </g>
  <path d="M43.6 47.2l3 3 6-6.4" fill="none" stroke="url(#odG)"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ground line. Solid fill, not the gradient — a horizontal line has a
       zero-height objectBoundingBox, so a gradient stroke never paints. -->
  <path d="M16 77h64" stroke="#3fe0cb" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>
</svg>
