<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AXA — Credentials</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Arial, sans-serif; max-width: 820px; margin: 36px auto; padding: 0 20px; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.6rem; margin: 0; }
    a { color: #2563eb; text-decoration: none; }
    .warn { font-size: .82rem; background: #f59e0b22; border: 1px solid #f59e0b55; border-radius: 8px; padding: 10px 12px; margin: 14px 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #8883; font-size: .9rem; vertical-align: top; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; opacity: .65; }
    code { font-family: ui-monospace, monospace; background: #8882; padding: 2px 6px; border-radius: 6px; }
    .pw { font-family: ui-monospace, monospace; }
    button { font-size: .78rem; padding: 4px 9px; border-radius: 7px; border: 1px solid #8884; background: #8881; cursor: pointer; margin-left: 6px; }
    .note { font-size: .78rem; opacity: .6; }
    .aad { color: #15803d; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>🔑 Service Credentials</h1>
    <span style="font-size:.85rem"><a href="/">← Portal home</a> · <a href="/ops">🛠️ Operations</a> · <a href="/.auth/logout">sign out</a></span>
  </header>
  <div class="warn">Read from Key Vault on demand · shown only to you (Azure AD) · masked by default. Avoid leaving this open on a shared screen.</div>
  <table id="tbl"><thead><tr><th>Service</th><th>Host</th><th>Database</th><th>Username</th><th>Password</th><th>Open</th></tr></thead><tbody id="rows"><tr><td colspan="6">loading…</td></tr></tbody></table>

  <script>
    const VM = "https://axa.westus3.cloudapp.azure.com";
    const esc = (s) => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])));

    async function load() {
      let r;
      try { r = await fetch("/api/secrets", { headers: { accept: "application/json" } }); }
      catch (e) { document.getElementById("rows").innerHTML = `<tr><td colspan=6>error: ${esc(e)}</td></tr>`; return; }
      if (r.status === 401) { location.href = "/.auth/login/aad"; return; }
      const { secrets } = await r.json();
      document.getElementById("rows").innerHTML = secrets.map(s => {
        const url = s.url || (VM + s.path);
        const pwCell = s.password
          ? `<span class="pw" data-pw="${esc(s.password)}">••••••••</span>
             <button onclick="reveal(this)">show</button>
             <button onclick="copyPw(this)">copy</button>`
          : `<span class="aad">${esc(s.note || "no password")}</span>`;
        const note = (s.password && s.note) ? `<div class="note">${esc(s.note)}</div>` : "";
        return `<tr>
          <td><b>${esc(s.service)}</b>${note}</td>
          <td>${s.host ? `<code>${esc(s.host)}</code>` : "—"}</td>
          <td>${s.db ? `<code>${esc(s.db)}</code>` : "—"}</td>
          <td>${s.user ? `<code>${esc(s.user)}</code>` : "—"}</td>
          <td>${pwCell}</td>
          <td><a href="${esc(url)}" target="_blank" rel="noopener">↗</a></td>
        </tr>`;
      }).join("");
    }
    function reveal(btn) {
      const span = btn.previousElementSibling;
      const shown = span.textContent !== "••••••••";
      span.textContent = shown ? "••••••••" : span.dataset.pw;
      btn.textContent = shown ? "show" : "hide";
    }
    async function copyPw(btn) {
      const span = btn.parentElement.querySelector(".pw");
      try { await navigator.clipboard.writeText(span.dataset.pw); btn.textContent = "copied"; }
      catch { btn.textContent = "blocked"; }
      setTimeout(() => (btn.textContent = "copy"), 1400);
    }
    load();
  </script>
</body>
</html>
