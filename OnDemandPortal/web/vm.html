<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>axa — on-demand VM</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Arial, sans-serif; max-width: 720px;
           margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.6rem; margin: 0; }
    .who { font-size: .85rem; opacity: .8; }
    .card { border: 1px solid #8884; border-radius: 12px; padding: 20px; margin: 20px 0; }
    .state { font-size: 1.1rem; font-weight: 600; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           margin-right: 8px; vertical-align: middle; background: #999; }
    .dot.running { background: #2ecc71; } .dot.down { background: #e74c3c; }
    .dot.deploying, .dot.deallocating { background: #f1c40f; }
    button { font-size: 1rem; padding: 10px 18px; border-radius: 8px; border: 0;
             cursor: pointer; margin-right: 10px; }
    .deploy { background: #2563eb; color: #fff; }
    .start { background: #15803d; color: #fff; }
    .stop { background: #b45309; color: #fff; }
    .destroy { background: #b91c1c; color: #fff; }
    .refresh { background: #8883; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    a { color: #2563eb; }
    table { border-collapse: collapse; margin-top: 10px; font-size: .9rem; }
    td { padding: 2px 14px 2px 0; }
    #log { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap;
           opacity: .75; margin-top: 16px; }
    .btnlink { display: inline-block; padding: 7px 14px; border-radius: 8px; background: #2563eb;
               color: #fff !important; text-decoration: none; margin-right: 8px; font-size: .9rem; }
    .btnlink.alt { background: #8883; color: inherit !important; }
    .sshrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sshrow code { background: #8882; padding: 8px 12px; border-radius: 8px; font-size: .85rem;
                   font-family: ui-monospace, monospace; flex: 1; min-width: 240px; }
    .services { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px; margin-top: 6px; }
    .svc { display: block; padding: 12px; border: 1px solid #8884; border-radius: 10px;
           text-decoration: none; color: inherit; transition: border-color .15s; }
    .svc:hover { border-color: #2563eb; }
    .svc b { display: block; color: #2563eb; }
    .svc span { font-size: .8rem; opacity: .7; }
    .hdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
            vertical-align: middle; background: #9994; }
    .hdot.up { background: #2ecc71; } .hdot.down { background: #e74c3c; } .hdot.unk { background: #9994; }
    .section-title { font-weight: 600; margin: 0 0 10px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="text-decoration:none;color:inherit">☁️ AXA</a> — VM Manager</h1>
    <span class="who" id="who"></span>
  </header>
  <p style="margin:0 0 12px"><a href="/">← Portal home</a> · <a href="/ops">🛠️ Operations</a> · <a href="/credentials">🔑 Credentials</a></p>

  <div class="card">
    <div class="state"><span class="dot" id="dot"></span><span id="state">checking…</span></div>
    <table id="details"></table>
  </div>

  <div class="card" id="connect" style="display:none">
    <div style="font-weight:600; margin-bottom:10px">Connect</div>

    <div style="font-size:.85rem; opacity:.8">Web terminal (browser SSH)</div>
    <p style="margin:4px 0 14px">
      <a id="webSsh" class="btnlink" target="_blank" rel="noopener">Open web SSH ↗</a>
      <a id="webConsole" class="btnlink alt" target="_blank" rel="noopener">Guacamole ↗</a>
      <a id="website" class="btnlink alt" target="_blank" rel="noopener">Website ↗</a>
    </p>

    <div style="font-size:.85rem; opacity:.8">Local SSH</div>
    <div class="sshrow">
      <code id="sshCmd"></code>
      <button class="refresh" id="btnCopy">Copy</button>
    </div>
  </div>

  <div class="card" id="servicesCard" style="display:none">
    <p class="section-title">Services</p>
    <div class="services" id="services"></div>
  </div>

  <div>
    <button class="deploy"  id="btnDeploy">Deploy</button>
    <button class="start"   id="btnStart">Start</button>
    <button class="stop"    id="btnStop">Stop</button>
    <button class="destroy" id="btnDestroy">Destroy</button>
    <button class="refresh" id="btnRefresh">Refresh</button>
  </div>

  <div class="card" id="holdCard" style="display:none">
    <p class="section-title">Keep running (pause idle auto-stop)</p>
    <div id="holdStatus" style="font-size:.9rem; margin-bottom:10px; opacity:.85"></div>
    <div class="sshrow">
      <input id="holdDays" type="number" min="1" max="60" value="3"
             style="width:70px; padding:8px; border-radius:8px; border:1px solid #8884" />
      <span style="font-size:.9rem">days</span>
      <button class="start" id="btnHold">Hold</button>
      <button class="refresh" id="btnClearHold">Clear hold</button>
    </div>
  </div>

  <div id="log"></div>

  <script src="app.js"></script>
</body>
</html>
